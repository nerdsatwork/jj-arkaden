<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0420"/>
      <stop offset=".55" stop-color="#2a0b4a"/>
      <stop offset="1" stop-color="#5b0f5e"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe14d"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0878be"/>
      <stop offset="1" stop-color="#12d98a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sunCut">
      <rect x="0" y="0" width="640" height="200"/>
      <rect x="0" y="206" width="640" height="10"/>
      <rect x="0" y="222" width="640" height="8"/>
      <rect x="0" y="236" width="640" height="6"/>
    </clipPath>
  </defs>
  <rect width="640" height="400" fill="url(#sky)"/>
  <circle cx="320" cy="245" r="105" fill="url(#sun)" clip-path="url(#sunCut)" opacity=".9"/>
  <rect y="248" width="640" height="152" fill="#120326"/>
  <g stroke="#ff2bd6" stroke-width="2" filter="url(#glow)" opacity=".85">
    <line x1="0" y1="250" x2="640" y2="250"/>
    <line x1="0" y1="262" x2="640" y2="262"/>
    <line x1="0" y1="280" x2="640" y2="280"/>
    <line x1="0" y1="306" x2="640" y2="306"/>
    <line x1="0" y1="342" x2="640" y2="342"/>
    <line x1="0" y1="392" x2="640" y2="392"/>
    <line x1="320" y1="250" x2="320" y2="400"/>
    <line x1="290" y1="250" x2="200" y2="400"/>
    <line x1="350" y1="250" x2="440" y2="400"/>
    <line x1="260" y1="250" x2="80" y2="400"/>
    <line x1="380" y1="250" x2="560" y2="400"/>
    <line x1="230" y1="250" x2="-40" y2="400"/>
    <line x1="410" y1="250" x2="680" y2="400"/>
  </g>
  <g filter="url(#glow)">
    <path d="M70 360 C 140 320, 170 380, 240 345 S 330 300, 380 330" fill="none" stroke="url(#body)" stroke-width="26" stroke-linecap="round"/>
    <path d="M70 360 C 140 320, 170 380, 240 345 S 330 300, 380 330" fill="none" stroke="#5cffc8" stroke-width="3" stroke-linecap="round" opacity=".7"/>
    <ellipse cx="392" cy="334" rx="24" ry="19" fill="#7dffd0" stroke="#5cffc8" stroke-width="3"/>
    <circle cx="398" cy="326" r="6" fill="#fff"/><circle cx="400" cy="326" r="3" fill="#ff2bd6"/>
    <circle cx="398" cy="343" r="6" fill="#fff"/><circle cx="400" cy="343" r="3" fill="#ff2bd6"/>
    <path d="M415 335 h14 l5 -5 M429 335 l5 5" stroke="#ff2bd6" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g filter="url(#glow)" transform="translate(500 300)">
    <rect x="-34" y="-34" width="68" height="68" rx="10" fill="#3a0716" stroke="#ff3b6b" stroke-width="3"/>
    <text x="0" y="-6" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="18" fill="#ff3b6b">EU</text>
    <text x="0" y="18" text-anchor="middle" font-family="Arial Black, Impact, sans-serif" font-size="16" fill="#ffe14d">FINE</text>
  </g>
  <g font-family="Arial Black, Impact, sans-serif" font-style="italic" text-anchor="middle" filter="url(#glow)">
    <text x="320" y="92" font-size="58" fill="#ffe6fb" stroke="#ff2bd6" stroke-width="2">REGULATION</text>
    <text x="320" y="152" font-size="58" fill="#e6fffb" stroke="#22e5ff" stroke-width="2">SNAKE</text>
  </g>
  <text x="320" y="186" text-anchor="middle" font-family="Courier New, monospace" font-size="17" fill="#22e5ff">Move fast. Eat things. Avoid Brussels.</text>
</svg>
