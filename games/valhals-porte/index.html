<script>
"use strict";

/* =========================================================
   VALHALS PORTE
   Et lille roguelite-actionspil. Alt tegnes i kode — ingen
   billedfiler, ingen biblioteker, ingen internetforbindelse.

   Grafisk stil: mørke silhuetter med glød, som beskrevet, men
   holdt op mod Hades' måde at gøre det på:
     · varm mod kold — helten og alt guld er varmt, banen og
       fjenderne er kolde. Det er derfor figurerne popper ud.
     · ornamenteret ramme om banen, hugget i sten, med
       nordisk ringkæde, hjørnemedaljoner og en valknut.
     · blus i hjørnerne, der kaster flakkende varmt lys på gulvet.
     · runer, gudesigiller og alt ornamentik tegnet med streger,
       så det virker uanset hvilke skrifttyper computeren har.

   Våbnet er et SPYD:
     · Venstre museklik = stød. Tre i træk giver et langt fremstød.
     · Højre museklik   = kast spydet. Det rammer alt på vejen
       og kommer tilbage af sig selv.
     · Dash + stød lige efter = kraftigt fremstød.

   Man sigter med musen i højre hånd og går med venstre. Derfor kan
   man undvige på fire måder, så der altid er én, man kan nå:
     · dobbelttryk på en retningstast — undviger den vej. Kræver
       ingen ekstra finger, for hånden ligger der allerede.
     · Skift (venstre eller højre) — til en fri lillefinger.
     · hjulklik på musen — til den hånd, der holder musen.
     · mellemrum — som før, hvis tommelfingeren er ledig.
   Kast spydet ligger også på Q og F, ikke kun højre museklik.

   Kodens afsnit:
     1. Opsætning, palet og hjælpere
     2. Runer, ornamenter og gudesigiller
     3. Input
     4. Spilleren og velsignelsernes virkning
     5. Velsignelserne fra guderne
     6. Fjender og rum
     7. Opdatering (spillets logik)
     8. Baggrund: stenlag, blus, lys og korn
     9. Tegning af figurer
    10. HUD og skærme
    11. Spilsløjfen
   ========================================================= */

/* ---------------------------------------------------------
   1. OPSÆTNING, PALET OG HJÆLPERE
   --------------------------------------------------------- */

const ctx = canvas.getContext('2d');

const FARVE = {

const klem = (v, a, b) => v < a ? a : (v > b ? b : v);
const tilf = (a, b) => a + Math.random() * (b - a);
function vinkelDiff(a, b) {
  let d = (a - b) % (Math.PI * 2);
  if (d >  Math.PI) d -= Math.PI * 2;
  if (d < -Math.PI) d += Math.PI * 2;
  return d;
}
// fast "tilfældighed" ud fra to tal — bruges til stenens slid,
// så mønstret ligger stille i stedet for at flimre
function fastTilf(i, j) {
  const n = Math.sin(i * 127.1 + j * 311.7) * 43758.5453;
  return n - Math.floor(n);
}

/* ---------------------------------------------------------
   2. RUNER, ORNAMENTER OG GUDESIGILLER
   Alt er streger, så intet afhænger af skrifttyper.
   Runerne er tegnet i et felt hvor x går fra -0,4 til 0,4
   og y fra -1 til 1.
   --------------------------------------------------------- */
const RUNER = {
  fehu:     [[[-.28,-1],[-.28,1]],[[-.28,-.6],[.38,-.92]],[[-.28,-.12],[.38,-.44]]],
  uruz:     [[[-.34,1],[-.34,-.95]],[[-.34,-.95],[.34,-.62]],[[.34,-.62],[.34,1]]],
  thurisaz: [[[-.3,-1],[-.3,1]],[[-.3,-.6],[.36,-.18]],[[.36,-.18],[-.3,.24]]],
  ansuz:    [[[-.28,-1],[-.28,1]],[[-.28,-.84],[.36,-.5]],[[-.28,-.34],[.36,0]]],
  raidho:   [[[-.28,-1],[-.28,1]],[[-.28,-1],[.32,-.68]],[[.32,-.68],[-.28,-.3]],[[-.28,-.3],[.34,1]]],
  kaunan:   [[[.3,-.95],[-.3,0]],[[-.3,0],[.3,.95]]],
  gebo:     [[[-.38,-.9],[.38,.9]],[[.38,-.9],[-.38,.9]]],
  wunjo:    [[[-.28,-1],[-.28,1]],[[-.28,-1],[.34,-.66]],[[.34,-.66],[-.28,-.3]]],
  hagalaz:  [[[-.34,-1],[-.34,1]],[[.34,-1],[.34,1]],[[-.34,-.2],[.34,.2]]],
  isa:      [[[0,-1],[0,1]]],
  sowilo:   [[[.3,-1],[-.24,-.4]],[[-.24,-.4],[.3,.1]],[[.3,.1],[-.24,.7]]],
  tiwaz:    [[[0,-1],[0,1]],[[-.36,-.5],[0,-1]],[[0,-1],[.36,-.5]]],
  laguz:    [[[-.2,-1],[-.2,1]],[[-.2,-1],[.34,-.56]]],
  algiz:    [[[0,1],[0,-1]],[[0,-.3],[-.4,-1]],[[0,-.3],[.4,-1]]],
  othala:   [[[0,-1],[.34,-.5]],[[.34,-.5],[0,0]],[[0,0],[-.34,-.5]],[[-.34,-.5],[0,-1]],[[0,0],[.36,1]],[[0,0],[-.36,1]]],
  dagaz:    [[[-.34,-.9],[-.34,.9]],[[.34,-.9],[.34,.9]],[[-.34,-.9],[.34,.9]],[[-.34,.9],[.34,-.9]]],
  mannaz:   [[[-.34,-1],[-.34,1]],[[.34,-1],[.34,1]],[[-.34,-1],[.34,-.1]],[[.34,-1],[-.34,-.1]]],
  ingwaz:   [[[0,-.9],[.34,0]],[[.34,0],[0,.9]],[[0,.9],[-.34,0]],[[-.34,0],[0,-.9]]]
};
const RUNENAVNE = Object.keys(RUNER);

function tegnRune(g, navn, x, y, s, farve, lw) {
  const r = RUNER[navn]; if (!r) return;
  g.save();
  g.strokeStyle = farve; g.lineWidth = lw || 2;
  g.lineCap = 'round'; g.lineJoin = 'round';
  g.beginPath();
  for (const seg of r) {
    g.moveTo(x + seg[0][0] * s, y + seg[0][1] * s);
    g.lineTo(x + seg[1][0] * s, y + seg[1][1] * s);
  }
  g.stroke();
  g.restore();
}

// Valknut — Odins tegn: tre trekanter der griber ind i hinanden
function tegnValknut(g, x, y, s, farve, lw) {
  g.save();
  g.strokeStyle = farve; g.lineWidth = lw || 2.4;
  g.lineJoin = 'round';
  for (let i = 0; i < 3; i++) {
    const a = -Math.PI / 2 + i * Math.PI * 2 / 3;
    const cx = x + Math.cos(a) * s * 0.30, cy = y + Math.sin(a) * s * 0.30;
    g.beginPath();
    for (let k = 0; k < 3; k++) {
      const b = -Math.PI / 2 + i * Math.PI * 2 / 3 + k * Math.PI * 2 / 3;
      const px = cx + Math.cos(b) * s * 0.62, py = cy + Math.sin(b) * s * 0.62;
      if (k === 0) g.moveTo(px, py); else g.lineTo(px, py);
    }
    g.closePath(); g.stroke();
  }
  g.restore();
}

// Ringkæde — det båndornament der løber langs stenrammen
function tegnRingkaede(g, x1, y1, x2, y2, r, farve) {
  const laengde = Math.hypot(x2 - x1, y2 - y1);
  const vink = Math.atan2(y2 - y1, x2 - x1);
  const skridt = r * 1.25;
  const antal = Math.floor(laengde / skridt);
  g.save();
  g.translate(x1, y1); g.rotate(vink);
  const start = (laengde - antal * skridt) / 2 + skridt / 2;
  for (let i = 0; i < antal; i++) {
    const cx = start + i * skridt;
    // mørk fals under ringen, så den ser hugget ud
    g.strokeStyle = 'rgba(0,0,0,0.55)'; g.lineWidth = 4.2;
    g.beginPath(); g.arc(cx, 0, r, 0, Math.PI * 2); g.stroke();
    g.strokeStyle = farve; g.lineWidth = 1.7;
    g.beginPath(); g.arc(cx, 0, r, 0, Math.PI * 2); g.stroke();
  }
  g.restore();
}

// Gudernes sigiller. Hver gud har sit eget tegn.
function tegnGudeSigil(g, navn, x, y, s, farve, glod) {
  g.save();
  g.translate(x, y);
  g.strokeStyle = farve; g.lineJoin = 'round'; g.lineCap = 'round';
  g.lineWidth = Math.max(1.8, s * 0.13);
  if (glod !== false) { g.shadowColor = farve; g.shadowBlur = s * 0.7; }
  const morkt = 'rgba(6,9,20,0.92)';

  if (navn === 'THOR') {                       // Mjølner
    g.beginPath();
    g.moveTo(-s * 0.72, -s * 0.78); g.lineTo(s * 0.72, -s * 0.78);
    g.lineTo(s * 0.55, -s * 0.12); g.lineTo(-s * 0.55, -s * 0.12);
    g.closePath();
    g.fillStyle = morkt; g.fill(); g.stroke();
    g.beginPath();
    g.moveTo(-s * 0.17, -s * 0.12); g.lineTo(-s * 0.17, s * 0.72);
    g.lineTo(s * 0.17, s * 0.72); g.lineTo(s * 0.17, -s * 0.12);
    g.closePath(); g.fillStyle = morkt; g.fill(); g.stroke();
    g.beginPath();
    g.moveTo(-s * 0.4, s * 0.9); g.lineTo(s * 0.4, s * 0.9); g.stroke();

  } else if (navn === 'FREJA') {               // Brísingamen og falkevinger
    g.beginPath(); g.arc(0, -s * 0.1, s * 0.46, 0, Math.PI * 2);
    g.fillStyle = morkt; g.fill(); g.stroke();
    g.beginPath();
    g.moveTo(0, s * 0.36); g.lineTo(-s * 0.2, s * 0.68);
    g.lineTo(0, s * 0.98); g.lineTo(s * 0.2, s * 0.68);
    g.closePath(); g.fillStyle = morkt; g.fill(); g.stroke();
    g.beginPath();
    g.moveTo(-s * 0.42, -s * 0.3);
    g.quadraticCurveTo(-s * 1.0, -s * 0.65, -s * 0.95, -s * 0.02);
    g.moveTo(s * 0.42, -s * 0.3);
    g.quadraticCurveTo(s * 1.0, -s * 0.65, s * 0.95, -s * 0.02);
    g.stroke();

  } else if (navn === 'ODIN') {                // valknut
    tegnValknut(g, 0, 0, s * 1.05, farve, Math.max(1.8, s * 0.12));

  } else if (navn === 'LOKE') {                // slyngende slange
    g.beginPath();
    g.moveTo(-s * 0.8, s * 0.7);
    g.bezierCurveTo(-s * 1.05, -s * 0.5, s * 0.1, -s * 1.05, s * 0.32, -s * 0.2);
    g.bezierCurveTo(s * 0.5, s * 0.5, -s * 0.45, s * 0.55, -s * 0.28, -s * 0.3);
    g.bezierCurveTo(-s * 0.15, -s * 0.85, s * 0.85, -s * 0.5, s * 0.72, s * 0.62);
    g.stroke();
    // hoved med kløftet tunge
    g.beginPath();
    g.moveTo(s * 0.72, s * 0.62); g.lineTo(s * 0.95, s * 0.85);
    g.moveTo(s * 0.72, s * 0.62); g.lineTo(s * 0.5, s * 0.88);
    g.stroke();

  } else if (navn === 'TYR') {                 // tiwaz i en skjoldring
    g.beginPath(); g.arc(0, 0, s * 0.9, 0, Math.PI * 2);
    g.fillStyle = morkt; g.fill(); g.stroke();
    tegnRune(g, 'tiwaz', 0, 0, s * 0.62, farve, Math.max(2, s * 0.15));
  }
  g.restore();
}

/* ---------------------------------------------------------
   3. INPUT
   --------------------------------------------------------- */
const taster = Object.create(null);
const mus = { x: W / 2, y: H / 2, nede: false };
let musKlik = false, hojreKlik = false, dashOnsket = false;
let dashAbsolut = null;   // undvig i en fast retning (dobbelttryk)

// Dobbelttryk på en retningstast undviger den vej. Vi husker, hvornår
// hver tast sidst blev trykket; kommer der et nyt tryk inden for
// vinduet, bliver det et undvig i stedet for et skridt.
const sidsteTryk = Object.create(null);
const DOBBELT_VINDUE = 0.27;    // sekunder
const RETNINGER = {
  ArrowLeft:  Math.PI,      KeyA: Math.PI,
  ArrowRight: 0,            KeyD: 0,
  ArrowUp:   -Math.PI / 2,  KeyW: -Math.PI / 2,
  ArrowDown:  Math.PI / 2,  KeyS:  Math.PI / 2
};

const BLOKERES = ['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'];
window.addEventListener('keydown', e => {
  if (BLOKERES.includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  taster[e.code] = true;
  const iMenu = tilstand === 'start' || tilstand === 'sejr' || tilstand === 'doed';
  if (iMenu && (e.code === 'Space' || e.code === 'Enter' || e.code === 'NumpadEnter')) {
    nyRunde(); return;
  }
  if (e.code === 'Enter' && tilstand !== 'spil' && tilstand !== 'velsignelse') nyRunde();

  // undvig — flere taster, så der altid er én man kan nå
  if (e.code === 'Space' || e.code === 'ShiftLeft' || e.code === 'ShiftRight') dashOnsket = true;

  // dobbelttryk på en retningstast undviger den vej
  if (e.code in RETNINGER) {
    if (sidsteTryk[e.code] && tid - sidsteTryk[e.code] < DOBBELT_VINDUE) {
      dashAbsolut = RETNINGER[e.code];
      sidsteTryk[e.code] = 0;
    } else {
      sidsteTryk[e.code] = tid;
    }
  }

  if (e.code === 'KeyQ' || e.code === 'KeyF') hojreKlik = true;   // kast spydet
  if (tilstand === 'velsignelse') {
    if (e.code === 'Digit1' || e.code === 'Numpad1') vaelgVelsignelse(0);
    if (e.code === 'Digit2' || e.code === 'Numpad2') vaelgVelsignelse(1);
    if (e.code === 'Digit3' || e.code === 'Numpad3') vaelgVelsignelse(2);
  }
});
window.addEventListener('keyup', e => { taster[e.code] = false; });

function musPos(e) {
  const r = canvas.getBoundingClientRect();
  return { x: (e.clientX - r.left) * (W / r.width), y: (e.clientY - r.top) * (H / r.height) };
}
canvas.addEventListener('mousemove', e => { const p = musPos(e); mus.x = p.x; mus.y = p.y; });
canvas.addEventListener('mousedown', e => {
  const p = musPos(e); mus.x = p.x; mus.y = p.y;
  if (e.button === 1) { dashOnsket = true; e.preventDefault(); return; }   // hjulklik undviger
  if (e.button === 2) { hojreKlik = true; e.preventDefault(); return; }
  mus.nede = true; musKlik = true;
  if (tilstand === 'start' || tilstand === 'sejr' || tilstand === 'doed') { nyRunde(); return; }
  if (tilstand === 'velsignelse') klikPaaKort(p.x, p.y);
});
window.addEventListener('mouseup', e => { if (e.button !== 2) mus.nede = false; });
canvas.addEventListener('contextmenu', e => e.preventDefault());
window.addEventListener('blur', () => { for (const k in taster) taster[k] = false; mus.nede = false; });

function tilpasStorrelse() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width  = Math.floor(W * s) + 'px';
  canvas.style.height = Math.floor(H * s) + 'px';
}
window.addEventListener('resize', tilpasStorrelse);
tilpasStorrelse();

   4. SPILLEREN OG VELSIGNELSERNES VIRKNING
