<title>Flesh and Bones</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one 16:9 game screen, centered, with a quiet strip of key hints beneath. Deliberately single dark theme. */
:root{
  --void:#0b0710;
  --crypt:#1a1220;
  --bone:#e9e2cf;
  --blood:#a3192e;
  --gilt:#c9a24a;
  --ash:#8d8396;
  --display:"Pirata One", "Times New Roman", Georgia, serif;
  --ui:"Pixelify Sans", ui-monospace, Menlo, monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{
  margin:0;background:var(--void);color:var(--bone);font-family:var(--ui);
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:16px;box-sizing:border-box;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;min-height:100%;
}
.frame{
  width:min(100%, 1280px, calc((100vh - 130px) * 16 / 9));
  aspect-ratio:16/9;max-width:100%;
  background:#000;border:1px solid #3b2a40;
  box-shadow:0 0 0 4px #120b16, 0 0 60px rgba(163,25,46,.22);
}
canvas{display:block;width:100%;height:100%;image-rendering:crisp-edges;image-rendering:pixelated;outline:none;cursor:pointer}
canvas:focus-visible{outline:2px solid var(--gilt);outline-offset:3px}

  Snd.sfx=c.createGain();Snd.sfx.gain.value=0.8;Snd.sfx.connect(Snd.master);
  Snd.mus=c.createGain();Snd.mus.gain.value=0.45;Snd.mus.connect(Snd.master);
  const len=c.sampleRate;Snd.noise=c.createBuffer(1,len,c.sampleRate);const d=Snd.noise.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;

const mtof=m=>440*Math.pow(2,(m-69)/12);
function osc(type,f,t,dur,vol,dest,to,attack=0.01){
 const c=Snd.ctx,o=c.createOscillator();o.type=type;o.frequency.setValueAtTime(f,t);
 if(to)o.frequency.exponentialRampToValueAtTime(Math.max(20,to),t+dur);
 const gn=c.createGain();gn.gain.setValueAtTime(0.0001,t);gn.gain.exponentialRampToValueAtTime(vol,t+attack);gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 o.connect(gn);gn.connect(dest);o.start(t);o.stop(t+dur+0.05);
}
function nz(t,dur,vol,dest,type,f,to,q=1){
 const c=Snd.ctx,s=c.createBufferSource();s.buffer=Snd.noise;
 const fl=c.createBiquadFilter();fl.type=type;fl.frequency.setValueAtTime(f,t);if(to)fl.frequency.exponentialRampToValueAtTime(to,t+dur);fl.Q.value=q;
 const gn=c.createGain();gn.gain.setValueAtTime(vol,t);gn.gain.exponentialRampToValueAtTime(0.0001,t+dur);
 s.connect(fl);fl.connect(gn);gn.connect(dest);s.start(t,Math.random()*0.5);s.stop(t+dur+0.05);
}

function setSong(k){if(Snd.songKey===k)return;Snd.songKey=k;Snd.song=SONGS[k]||null;Snd.step=0;if(Snd.ctx)Snd.nextT=Snd.ctx.currentTime+0.12;}
function musTick(){
 const c=Snd.ctx;if(!c||!Snd.song)return;
 if(!Snd.on||c.state!=='running'){Snd.nextT=c.currentTime+0.05;return;}
 if(Snd.nextT<c.currentTime-0.3)Snd.nextT=c.currentTime+0.05;
 const s=Snd.song,spb=60/s.bpm/2;
 while(Snd.nextT<c.currentTime+0.15){try{musStep(s,Snd.step,Snd.nextT,spb);}catch(e){}Snd.nextT+=spb;Snd.step++;}
}
function musStep(s,i,t,spb){
 const d=Snd.mus,bars=s.chords.length,st=i%(bars*8),bar=Math.floor(st/8),pos=st%8,ch=s.chords[bar];
 if(pos===0)for(const n of ch){const f=mtof(s.root+n);osc('sine',f,t,spb*8,0.035,d,0,0.25);osc('triangle',f*2,t,spb*8,0.012,d,0,0.25);}
 if(pos%4===0||(s.drive&&pos%2===0))osc('triangle',mtof(s.root-12+ch[0]+(s.drive&&pos%4===2?7:0)),t,spb*(s.drive?1.8:3.8),0.11,d,0,0.02);
 const m=s.mel[st%s.mel.length];
 if(m&&m!=='.'&&m!=='-'){const idx=parseInt(m,36);const n=s.root+s.scale[idx%7]+12*Math.floor(idx/7);osc(s.drive?'square':'triangle',mtof(n),t,spb*1.7,s.drive?0.03:0.05,d,0,0.02);}
 if(s.drums){if(pos===0||pos===4)osc('sine',120,t,0.16,0.22,d,42,0.005);if(pos===2||pos===6)nz(t,0.12,0.12,d,'bandpass',1800);nz(t,0.03,0.03,d,'highpass',7000);}
}

/* ================= Level building ================= */
const SOLID='#XY';
function buildLevel(i,broken){
 const D=LEVELS[i],w=D.w,h=D.h||18,m=[];
 for(let y=0;y<h;y++)m.push(Array(w).fill(D.fill?'#':'.'));
 const spawn={ents:[],chests:[],candles:[],hearts:[],start:null,check:null,gate:0,arenaEnd:w-1,boss:null,door:null};
 const b={
  rect(x,y,ww,hh,c='#'){for(let j=y;j<y+hh;j++)for(let k=x;k<x+ww;k++)if(j>=0&&j<h&&k>=0&&k<w)m[j][k]=c;},
  plat(x,y,ww){this.rect(x,y,ww,1,'=');},
  carve(x,y,ww,hh){this.rect(x,y,ww,hh,'.');},
  spikes(x,ww,y=16){this.rect(x,y,ww,1,'^');this.rect(x,y+1,ww,1,'#');},
  ent(t,x,y){spawn.ents.push([t,x,y]);},
  chest(x,y,item){spawn.chests.push({x,y,item});},
  heart(id,x,y){spawn.hearts.push({id,x,y});},
  candle(x,y){spawn.candles.push({x,y});},
  start(x,y){spawn.start={x,y};},check(x,y){spawn.check={x,y};},
  gate(x){spawn.gate=x;},arena(e){spawn.arenaEnd=e;},boss(x,y){spawn.boss={x,y};},door(x,y){spawn.door={x,y};}
 };
 D.build(b);
 if(broken)for(const idx of broken){const y=Math.floor(idx/w),x=idx%w;if(m[y]&&SOLID.includes(m[y][x]))m[y][x]='.';}
 return {m,w,h,spawn};
}
LEVELS.forEach((D,i)=>{const B=buildLevel(i);D.meta={chests:B.spawn.chests.map(c=>c.item).concat(i===3?['crown']:i===2?['bow']:[]),hearts:B.spawn.hearts.map(h=>h.id)};});
const TOTAL_ITEMS=LEVELS.reduce((s,D)=>s+D.meta.chests.length,0);
const TOTAL_HEARTS=LEVELS.reduce((s,D)=>s+D.meta.hearts.length,0);

function archHalf(dy,w,pointed){const r=w/2;if(pointed){const k=Math.min(1,dy/(w*0.9));return r*Math.sqrt(Math.max(0,1-(1-k)*(1-k)));}if(dy>=r)return r;const q=r-dy;return Math.sqrt(Math.max(0,r*r-q*q));}
function archFill(t,x,y,w,h,col,pointed){t.fillStyle=col;for(let dy=0;dy<h;dy++){const hw=archHalf(dy,w,pointed);t.fillRect(Math.round(x+w/2-hw),y+dy,Math.round(hw*2),1);}}
function insideArch(dx,dy,w,h,pointed){if(dy<0||dy>=h)return false;return Math.abs(dx-w/2)<=archHalf(dy,w,pointed)-2;}
function skull(t,x,y,dim){t.fillStyle=dim?'#3a3040':'#55495a';t.fillRect(x,y,5,4);t.fillRect(x+1,y+4,3,1);t.fillStyle='#0b0610';t.fillRect(x+1,y+1,1,1);t.fillRect(x+3,y+1,1,1);}
function disc(t,cx,cy,r,col){t.fillStyle=col;for(let dy=-r;dy<=r;dy++){const hw=Math.sqrt(r*r-dy*dy);t.fillRect(Math.round(cx-hw),cy+dy,Math.round(hw*2),1);}}

function renderBg(i,lw){
 const bw=Math.ceil((lw*16-W)*0.4)+W+4;
 const c=document.createElement('canvas');c.width=bw;c.height=H;const t=c.getContext('2d');
 const pal=LEVELS[i].pal;
 const gr=t.createLinearGradient(0,0,0,H);gr.addColorStop(0,pal.bgTop);gr.addColorStop(1,pal.bgBot);t.fillStyle=gr;t.fillRect(0,0,bw,H);
 if(i===0){
  for(let x=0;x<bw;x+=48){
   t.fillStyle='#140c18';t.fillRect(x,0,8,H);t.fillStyle='#21162a';t.fillRect(x+1,0,1,H);
   for(let row=0;row<3;row++){
    const nx=x+15,ny=20+row*52,nw=26,nh=34;
    archFill(t,nx,ny,nw,nh,'#0b0610',false);
    for(let s=0;s<3;s++)skull(t,nx+3+s*7,ny+nh-8,hash(x,row,s)<0.35);
    t.fillStyle='#2a1d2e';t.fillRect(nx-2,ny+nh,nw+4,2);
   }
  }
 }else if(i===1){
  for(let x=10;x<bw;x+=80){
   t.fillStyle='#0a1418';t.fillRect(x-10,0,10,H);t.fillStyle='#152429';t.fillRect(x-9,0,2,H);
   const wx=x+22,wy=24,ww=30,wh=100;
   archFill(t,wx-3,wy-3,ww+6,wh+6,'#060c0d',true);
   for(let gy=wy;gy<wy+wh;gy+=6)for(let gx=wx;gx<wx+ww;gx+=6){
    if(!insideArch(gx+3-wx,gy+3-wy,ww,wh,true))continue;
    const v=hash(gx,gy,i);t.fillStyle=v<0.36?'#1d3d66':v<0.68?'#5c1a2a':'#6a5a24';
    t.globalAlpha=0.5+hash(gx,gy,7)*0.35;t.fillRect(gx,gy,5,5);
   }
   t.globalAlpha=1;
   t.fillStyle='rgba(140,190,220,0.045)';t.beginPath();t.moveTo(wx,wy+30);t.lineTo(wx+ww,wy+30);t.lineTo(wx+ww+46,H);t.lineTo(wx+12,H);t.fill();
  }
 }else if(i===2){
  for(let k=0;k<120;k++){t.fillStyle=`rgba(255,225,225,${0.2+hash(k,1,3)*0.5})`;t.fillRect(hash(k,2,3)*bw|0,hash(k,3,3)*100|0,1,1);}
  const mx=150,my=50;
  const rg=t.createRadialGradient(mx,my,10,mx,my,70);rg.addColorStop(0,'rgba(220,60,70,0.35)');rg.addColorStop(1,'rgba(0,0,0,0)');t.fillStyle=rg;t.fillRect(mx-70,my-70,140,140);
  disc(t,mx,my,22,'#b8323c');disc(t,mx-7,my-5,4,'#982a33');disc(t,mx+8,my+6,5,'#982a33');disc(t,mx+3,my-11,3,'#a32e37');
  let x=0;
  while(x<bw){
   const tw=(14+hash(x,1,5)*22)|0,th=(50+hash(x,2,5)*80)|0,top=H-th;
   t.fillStyle='#14070d';t.fillRect(x,top,tw,th);
   const rh=tw*1.2;for(let dy=0;dy<rh;dy++){const hw=(dy/rh)*(tw/2+2);t.fillRect(Math.round(x+tw/2-hw),Math.round(top-rh+dy),Math.max(1,Math.round(hw*2)),1);}
   if(hash(x,3,5)<0.65){t.fillStyle='#d8943a';t.fillRect((x+tw/2-1)|0,top+10,2,3);}
   if(hash(x,6,5)<0.4){t.fillStyle='#d8943a';t.fillRect((x+tw/2-1)|0,top+28,2,3);}
   x+=tw+4+((hash(x,4,5)*22)|0);
  }
  t.fillStyle='#0e050a';t.fillRect(0,H-40,bw,40);for(let x2=0;x2<bw;x2+=10)t.fillRect(x2,H-46,6,6);
 }else if(i===3){
  disc(t,230,40,14,'#c8d0a0');disc(t,226,37,13,'#1a2116');
  let x=0;
  while(x<bw){
   const hw=(26+hash(x,1,8)*24)|0,hh=(50+hash(x,2,8)*50)|0,top=H-hh,lean=Math.round((hash(x,5,8)-0.5)*6);
   t.fillStyle='#10140c';t.fillRect(x,top,hw,hh);
   for(let dy=0;dy<hw/2;dy++)t.fillRect(x+dy+lean,top-hw/2+dy,Math.max(1,hw-dy*2),1);
   t.fillRect(x+hw-8,top-hw/2-6,4,14);
   for(let wy=top+8;wy<H-14;wy+=16)for(let wx=x+4;wx<x+hw-6;wx+=10)if(hash(wx,wy,9)<0.35){t.fillStyle='#b8c85a';t.fillRect(wx,wy,3,4);t.fillStyle='#10140c';}
   x+=hw+2+((hash(x,4,8)*10)|0);
  }
  const mist=t.createLinearGradient(0,H-60,0,H);mist.addColorStop(0,'rgba(140,170,80,0)');mist.addColorStop(1,'rgba(140,170,80,0.18)');t.fillStyle=mist;t.fillRect(0,H-60,bw,60);
 }else{
  for(let x=20;x<bw;x+=90){
   for(let k=0;k<5;k++){
    const cx=x+k*8,r=40-k*2;
    t.fillStyle='rgba(216,206,180,0.10)';
    for(let a=0;a<=Math.PI;a+=0.04){t.fillRect(Math.round(cx+Math.cos(a)*r*0.5),Math.round(H-10-Math.sin(a)*r*2.2),2,2);}
   }
  }
  for(let x=0;x<bw;x+=7){const l=(4+hash(x,1,6)*24)|0;t.fillStyle='#0c0a14';for(let dy=0;dy<l;dy++)t.fillRect(x+Math.floor(dy/(l/3+1)),dy,Math.max(1,3-Math.floor(dy*3/l)),1);}
 }
 return c;
}

function drawTile(t,B,pal,x,y){
 const at=(xx,yy)=>(xx<0||xx>=B.w||yy<0||yy>=B.h)?'#':B.m[yy][xx];
 const sol=c=>SOLID.includes(c);
 const ch=B.m[y][x],px=x*16,py=y*16;
 t.clearRect(px,py,16,16);
 if(sol(ch)){
  t.fillStyle=pal.mortar;t.fillRect(px,py,16,16);
  for(let r=0;r<2;r++){
   const off=((y*2+r)%2)*4;
   for(let bx=-off;bx<16;bx+=8){
    const b0=Math.max(0,bx),b1=Math.min(16,bx+7);if(b1<=b0)continue;
    const v=hash(x*4+((bx+8)>>3),y*2+r,1);
    t.fillStyle=v<0.5?pal.stone:pal.stone2;t.fillRect(px+b0,py+r*8,b1-b0,7);
    t.fillStyle='rgba(255,255,255,0.05)';t.fillRect(px+b0,py+r*8,b1-b0,1);
    if(v>0.86){t.fillStyle=pal.mortar;t.fillRect(px+b0+2,py+r*8+3,2,1);}
   }
  }
  if(ch==='X'){t.fillStyle='rgba(0,0,0,0.45)';t.fillRect(px+4,py+3,1,3);t.fillRect(px+5,py+6,1,2);t.fillRect(px+6,py+8,2,1);t.fillRect(px+10,py+10,1,3);}
  if(ch==='Y'){t.fillStyle='#4a4a56';t.fillRect(px,py+3,16,2);t.fillRect(px,py+11,16,2);t.fillStyle='#9a9aa8';t.fillRect(px+3,py+3,1,1);t.fillRect(px+12,py+3,1,1);t.fillRect(px+3,py+11,1,1);t.fillRect(px+12,py+11,1,1);}
  if(!sol(at(x,y-1))){
   t.fillStyle=pal.top;t.fillRect(px,py,16,2);
   if(hash(x,y,3)<0.45){t.fillStyle=pal.moss;const mw=3+((hash(x,y,4)*6)|0);t.fillRect(px+((hash(x,y,5)*10)|0),py,mw,2);t.fillRect(px+((hash(x,y,6)*13)|0),py+2,1,2+((hash(x,y,7)*4)|0));}
  }
  if(!sol(at(x,y+1))&&y<B.h-1){t.fillStyle='rgba(0,0,0,0.35)';t.fillRect(px,py+14,16,2);}
  if(!sol(at(x-1,y))){t.fillStyle='rgba(255,255,255,0.06)';t.fillRect(px,py,1,16);}
  if(!sol(at(x+1,y))){t.fillStyle='rgba(0,0,0,0.3)';t.fillRect(px+15,py,1,16);}
 }else if(ch==='='){
  t.fillStyle=pal.ledge;t.fillRect(px,py,16,4);
  t.fillStyle=pal.ledgeHi;t.fillRect(px,py,16,1);
  t.fillStyle=pal.ledgeDark;t.fillRect(px,py+4,16,1);t.fillRect(px+(x%2?7:11),py+1,1,3);
  if(at(x-1,y)!=='='){t.fillRect(px+2,py+5,2,5);t.fillRect(px+3,py+10,1,2);}
  if(at(x+1,y)!=='='){t.fillRect(px+12,py+5,2,5);t.fillRect(px+12,py+10,1,2);}

const PLV_MAX=30;

function gainXP(n){
 if(n<=0)return;
 save.xp=(save.xp||0)+n;floatText(P.x+5,P.y-6,`+${n} XP`,'#9ad8ff');
 let up=0;
 while(plv()<PLV_MAX&&save.xp>=xpNeed(plv())){save.xp-=xpNeed(plv());save.plv=plv()+1;up++;}
 if(plv()>=PLV_MAX)save.xp=0;
 if(up){
  SFX.bigHeart();P.hp=Math.min(maxHP(),P.hp+1);levelUpFx();

// Sølvspyd: one 200° sweep from behind, over the head, to low in front. ph runs 0→1 over the 14 attack frames.
function spearAng(ph){const k=clamp((ph-0.2)/0.52,0,1);return -3.32+(1-(1-k)*(1-k))*3.49;}
function atkBox(){
 const w=WEAPONS[save.weapon];
 if(save.weapon==='spear'){
  // box around the wedge swept since last frame, so the arc has no gaps between frames
  const ph=1-P.atkT/14,a1=spearAng(ph),a0=spearAng(Math.max(0,ph-1/14)),cx=P.face>0?P.x+7:P.x+3,cy=P.y+10;
  let x0=cx,x1=cx,y0=cy,y1=cy;
  for(const a of [a0,(a0+a1)/2,a1])for(const r of [w.reach*0.5,w.reach]){const px=cx+P.face*Math.cos(a)*r,py=cy+Math.sin(a)*r;x0=Math.min(x0,px);x1=Math.max(x1,px);y0=Math.min(y0,py);y1=Math.max(y1,py);}

 return b.phase===2?Math.ceil(sum/b.p2tot*b.max/4):sum;
}
function hydraPhase2(b){
 const HY=HYDRAS[b.v],m=DIFF().boss,hpv=v=>Math.max(1,Math.round(v*m)),bx=b.bx,fy=b.fy;
 b.phase=2;flash=12;shake=16;SFX.roar();
 burst(bx+20,fy-50,40,HY.shed,2.6,0.12,60,2);
 if(b.v==='S'){
  b.heads=[[-18,-30],[-48,-64],[-14,-100],[-44,-34],[10,-78]].map(([dx,dy],i)=>{const h=hydraHead(bx,fy,dx,dy,i,hpv(4),i>2?0.8:1);if(i>2)h.grow=0;return h;});
 }else if(b.v==='T'){
  b.heads=[[-18,-30],[-48,-64],[-14,-100]].map(([dx,dy],i)=>hydraHead(bx,fy,dx,dy,i,hpv(5),1));
  b.waterT=56;
 }else{
  const h=hydraHead(bx,fy,-56,-74,0,hpv(14),2);h.ax=bx+18;h.ay=fy-30;b.heads=[h];
 }
 b.p2tot=b.heads.reduce((s,h)=>s+h.hp,0);
 banner({kind:'hint',title:HY.rage,sub:HY.tip,dur:220});
}
function hydraShoot(b,h){
 const pcx=P.x+P.w/2,pcy=P.y+P.h/2,s=h.scale,sx=h.x-8*s,sy=h.y+2;SFX.spit();
 if(b.v==='S'){const T=48,dx=pcx-sx,dy=pcy-sy;projs.push({kind:'acid',x:sx,y:sy,vx:dx/T,vy:clamp(dy/T-0.5*0.13*T,-5,1),grav:0.13,r:3,dmg:1,life:200,t:0,pool:b.phase===2});}
 else if(b.v==='T'){const dx=pcx-sx,dy=pcy-sy,d=Math.hypot(dx,dy)||1;projs.push({kind:'jet',x:sx,y:sy,vx:dx/d*3,vy:dy/d*3,grav:0,r:3,dmg:1,life:140,t:0});}
 else{const T=52,dx=pcx-sx,dy=pcy-sy,n=s>1?3:1;for(let i=0;i<n;i++){const k=i-(n-1)/2;projs.push({kind:'fire',x:sx,y:sy,vx:dx/T+k*0.5,vy:clamp(dy/T-0.5*0.12*T,-5,1)-Math.abs(k)*0.3,grav:0.12,r:3,dmg:1,life:200,t:0});}}
}
function updHydra(b){
 b.t++;b.st++;if(b.bellT>0)b.bellT--;
 const pcx=P.x+P.w/2,pcy=P.y+P.h/2,p2=b.phase===2,fast=p2?1.5:1,wl=b.fy-b.water;
 b.water+=(b.waterT-b.water)*0.02;
 if(b.state==='shed'){
  for(const h of b.heads){if(h.hurt>0)h.hurt--;if(h.dead)continue;h.x+=(h.rx-h.x)*0.1+rnd(-0.6,0.6);h.y+=(h.ry-h.y)*0.1;h.mouth=Math.max(0,h.mouth-0.1);}
  if(b.st===40)hydraPhase2(b);
  if(b.st>=80)b.state='fight';
 }else for(const h of b.heads){
  if(h.hurt>0)h.hurt--;
  if(h.grow<1){h.grow=Math.min(1,h.grow+0.025);continue;}
  if(h.dead){if(!p2&&--h.regrow<=0){h.dead=false;h.hp=h.max;h.state='idle';h.cool=90;h.x=h.rx;h.y=h.ry;burst(h.x,h.y,14,HYDRAS[b.v].shed,1.6,0.05,30);}continue;}
  h.t++;
  const ix=h.rx+Math.sin(b.t*0.05+h.ph)*6,iy=h.ry+Math.cos(b.t*0.04+h.ph)*5;
  if(h.state==='idle'){
   h.x+=(ix-h.x)*0.15;h.y+=(iy-h.y)*0.15;h.mouth=Math.max(0,h.mouth-0.1);
   if(--h.cool<=0){
    const r=Math.random(),near=Math.hypot(pcx-h.x,pcy-h.y)<150;
    if(b.v==='F'&&p2&&!b.breath&&r<0.5)h.state='breath';
    else if(b.v==='T'&&p2&&r<0.4)h.state='dive';
    else h.state=(near&&r<0.55)?'lunge':'spit';
    h.t=0;if(b.v==='T')b.bellT=24;
   }
  }else if(h.state==='lunge'){
   const s=h.scale;
   if(h.t<26){h.x+=(h.rx+12+Math.sin(h.t)*1.5-h.x)*0.2;h.y+=(h.ry-4-h.y)*0.2;h.mouth=Math.min(1,h.mouth+0.06);
    if(h.t===25){const dx=pcx-h.x,dy=pcy-h.y,d=Math.hypot(dx,dy)||1,m=Math.min(d,120*(s>1?1.3:1));h.fromX=h.x;h.fromY=h.y;h.tgX=h.x+dx/d*m;h.tgY=Math.min(b.fy-7*s,h.y+dy/d*m);}}
   else if(h.t<40){const k=(h.t-25)/15;h.x=h.fromX+(h.tgX-h.fromX)*k;h.y=h.fromY+(h.tgY-h.fromY)*k;}
   else if(h.t<52){h.mouth=1;}
   else if(h.t<80){h.x+=(ix-h.x)*0.1;h.y+=(iy-h.y)*0.1;h.mouth=Math.max(0,h.mouth-0.05);}
   else{h.state='idle';h.cool=(100+Math.random()*90)/fast;}
  }else if(h.state==='spit'){
   h.x+=(ix-h.x)*0.15;h.y+=(iy-h.y)*0.15;
   h.mouth=h.t<24?Math.min(1,h.mouth+0.05):Math.max(0,h.mouth-0.08);
   if(h.t===24)hydraShoot(b,h);
   if(h.t>=44){h.state='idle';h.cool=(110+Math.random()*80)/fast;}
  }else if(h.state==='dive'){ // Tidevand fase 2: sink, then burst up under the player
   if(h.t<30){h.y+=(wl+24-h.y)*0.1;h.x+=(h.rx-h.x)*0.1;}
   else if(h.t===30){h.x=clamp(pcx,b.aL+20,b.bx-30);h.y=wl+26;}
   else if(h.t<46){h.y+=(pcy+2-h.y)*0.22;h.mouth=Math.min(1,h.mouth+0.1);if(h.t===33){SFX.spit();burst(h.x,wl,14,['#9ff0ff','#5a8aa8','#e6fbff'],1.8,0.12,30);}}
   else if(h.t<64){h.mouth=1;}
   else if(h.t<90){h.y+=(wl+26-h.y)*0.15;h.mouth=Math.max(0,h.mouth-0.08);}
   else{h.x=h.rx;h.y=wl+24;h.state='idle';h.cool=150/fast;}
  }else if(h.state==='breath'){ // Svovl fase 2: a fire stream sweeps the floor toward the gate
   h.x+=(h.rx-h.x)*0.1;h.y+=(h.ry-h.y)*0.1;
   h.mouth=h.t<36?Math.min(1,h.mouth+0.04):h.t<92?1:Math.max(0,h.mouth-0.06);
   if(h.t===36){b.breath={t:0,h};SFX.fire();shake=6;}
   if(h.t>=104){h.state='idle';h.cool=120;}
  }
 }
 // fire sweep
 if(b.breath){
  const br=b.breath,h=br.h;br.t++;
  const k=Math.min(1,br.t/56),fx=h.x-30+(b.aL+10-(h.x-30))*k,mx=h.x-18*h.scale,my=h.y+6;
  if(br.t<=56){
   for(let i=0;i<3;i++){const a=Math.random();parts.push({x:mx+(fx-mx)*a,y:my+(b.fy-4-my)*a+rnd(-3,3),vx:rnd(-0.3,0.3),vy:rnd(-0.5,0),grav:0,life:12,max:12,c:['#ff6a2a','#ffb04a','#ffe08a'][i],s:2});}
   for(let i=0;i<2;i++)parts.push({x:fx+rnd(-6,6),y:b.fy-2,vx:rnd(-0.5,0.5),vy:rnd(-1.6,-0.4),grav:0,life:18,max:18,c:'#ff6a2a',s:2});
   if(Math.abs(pcx-fx)<10&&P.y+P.h>b.fy-12)hurtPlayer(1,fx+10);
   if(br.t%6===0)SFX.fire();
  }
  if(br.t>60)b.breath=null;
 }
 // embers from the ceiling
 if(b.v==='F'&&p2&&b.state==='fight'&&--b.emberT<=0){b.emberT=Math.round(170/DIFF().spd);for(let i=0;i<5;i++)projs.push({kind:'ember',x:b.aL+16+i*((b.bx-b.aL-40)/4)+rnd(-8,8),y:b.fy-190-i*10,vx:0,vy:0.8,grav:0.05,r:3,dmg:1,life:240,t:0});}
 // acid pools
 for(const pl of b.pools){pl.t++;if(pl.t%40===0)parts.push({x:pl.x+rnd(-4,4),y:pl.y-2,vx:0,vy:-0.4,grav:0,life:14,max:14,c:'#e9ff9a',s:1});
  if(overlap(P,{x:pl.x-6,y:pl.y-3,w:12,h:3}))hurtPlayer(1,pl.x);}
 b.pools=b.pools.filter(pl=>pl.t<260);
 // deep water hurts: stay on the ledges
 if(b.water>20&&P.y+P.h>wl+6&&pcx<b.bx)hurtPlayer(1,pcx-1);
 b.hp=hydraHp(b);
 if(b.phase===1&&b.state==='fight'&&b.hp<=b.max/4){b.state='shed';b.st=0;shake=10;SFX.roar();for(const h of b.heads)h.state='idle';}
}
/* The third boss is Drakula, rolled at random from three variants each time the level loads.
   A keeps the bat form at 50 %. Every variant gets a new fase 2 at 25 % (state 'transform2', can't be hit). */
const DRACS={
 A:{name:'Count Dracula',epithet:'Lord of the Night',rage:'The blood moon rises',tip:'Jump the bats · watch for the blood pillars',burst:['#6a0f1e','#2a1830','#d2384a']},
 B:{name:'The Impaler Prince',epithet:'Prince of Wallachia',rage:'The blood becomes wings',tip:'Find the gap before the stakes come',burst:['#3a3a46','#a3192e','#c9a24a']},
 C:{name:'The Shadow Count',epithet:'Only his shadow is real',rage:'The shadow grows',tip:'Strike the heart · move when the shadow falls',burst:['#0d0a12','#4a2a6a','#c08aff']}
};
function draculaBox(b){
 if(b.form==='bat')return {x:b.x+6,y:b.y+2,w:24,h:16};
 if(b.form==='shade')return {x:b.x-6,y:b.y-6,w:12,h:12};
 if(b.v==='B')return {x:b.x+5,y:b.y+1,w:10,h:31};
 return {x:b.x+3,y:b.y,w:10,h:30};
}
function draculaVulnerable(b){return b.alpha>0.6&&b.state!=='transform'&&b.state!=='transform2';}
function draculaParry(b,box,bb){
 if(b.lastSwing===curSwing)return false;
 if(b.v==='C'&&b.form==='man'){
  for(const k of b.copies){
   if(k.real||k.gone)continue;
   if(overlap(box,{x:k.x+3,y:b.y,w:10,h:30})){
    k.gone=true;b.lastSwing=curSwing;SFX.vanish();burst(k.x+8,b.y+15,14,['#4a2a6a','#c08aff','#0d0a12'],1.6,0,26);
    if(!b.copyHint){b.copyHint=true;banner({kind:'hint',title:'A reflection',sub:'Only the true count casts a shadow',dur:200});}
    return true;
   }
  }
 }
 if(b.v==='B'&&b.form==='man'&&b.state==='idle'&&overlap(box,bb)&&Math.sign(P.x+P.w/2-(b.x+10))===b.face){
  b.lastSwing=curSwing;SFX.clang();burst(b.x+10+b.face*8,P.y+8,6,['#ffffff','#d8d8e0'],1.4,0.05,14);
  if(!b.parryHint){b.parryHint=true;banner({kind:'hint',title:'He parries from the front',sub:'Strike right after his slash, or from behind',dur:220});}
  return true;
 }
 return false;
}
function dracFx(b){
 for(const f of b.fx){
  f.t++;if(f.t<0)continue;
  if(f.kind==='pillar'){
   const u=f.t-20,h=u<0?0:u<6?u*6:u<34?36:Math.max(0,36-(u-34)*3);
   if(u===0)SFX.spit();
   if(h>8&&overlap(P,{x:f.x-4,y:b.fy-h,w:8,h}))hurtPlayer(1,f.x);
   f.done=f.t>=70;
  }else if(f.kind==='stake'){
   const w=f.warn,u=f.t-w,h=u<0?0:u<4?u*6:u<30?22:Math.max(0,22-(u-30)*2);
   if(u===0&&f.snd){SFX.slam();shake=4;}
   if(h>6&&overlap(P,{x:f.x-2,y:b.fy-h,w:5,h}))hurtPlayer(1,f.x);
   f.done=f.t>=w+42;
  }else if(f.kind==='hand'){
   if(f.t===40){SFX.slam();shake=8;burst(f.x,b.fy-2,12,['#3e2329','#4a2a6a'],2,0.15,24,2);}
   if(f.t>=40&&f.t<=62&&overlap(P,{x:f.x-14,y:b.fy-26,w:28,h:26}))hurtPlayer(1,f.x);
   f.done=f.t>=90;
  }
 }
 b.fx=b.fx.filter(f=>!f.done);
}
function dracEnterP2(b){
 const mid=(b.aL+b.aR)/2;
 b.phase=2;b.alpha=1;b.hurt=0;flash=12;shake=16;SFX.roar();
 if(b.v==='A'){b.form='lord';b.w=16;b.h=30;b.x=mid+40;b.y=b.fy-64;}
 else if(b.v==='B'){b.form='wings';b.w=20;b.h=32;b.x=mid+40;b.y=b.fy-70;}
 else{b.form='shade';b.w=12;b.h=12;b.x=mid;b.y=b.fy-82;b.copies=[];}
 burst(b.x+8,b.y+14,40,DRACS[b.v].burst,2.6,0.08,60,2);
 banner({kind:'hint',title:DRACS[b.v].rage,sub:DRACS[b.v].tip,dur:220});
}
function updDracula(b){
 b.t++;if(b.hurt>0)b.hurt--;
 const pcx=P.x+P.w/2;
 dracFx(b);
 if(b.phase===1&&b.hp<=b.max/4&&b.state!=='transform'&&b.state!=='transform2'){
  b.state='transform2';b.t=0;b.alpha=1;shake=20;projs=[];b.fx=[];banners=[];SFX.roar();

 }
 if(b.state==='transform2'){

  if(b.t===40)dracEnterP2(b);
  if(b.t>=80){b.state='hover';b.t=0;}

 }
 ({A:updDracA,B:updDracB,C:updDracC})[b.v](b,pcx);
}

 }else if(b.form==='bat'){

function breakTile(tx,ty){
 const ch=L.m[ty][tx];
 let y0=ty,y1=ty;
 while(y0>0&&L.m[y0-1][tx]===ch)y0--;
 while(y1<L.h-1&&L.m[y1+1][tx]===ch)y1++;
 const list=save.broken[lvl]||(save.broken[lvl]=[]);
 for(let y=y0;y<=y1;y++){
  L.m[y][tx]='.';list.push(y*L.w+tx);
  burst(tx*16+8,y*16+8,10,[LEVELS[lvl].pal.stone,LEVELS[lvl].pal.top,'#1a1420'],2,0.15,40,2);
 }
 for(let y=y0-1;y<=y1+1;y++)for(let x=tx-1;x<=tx+1;x++)if(y>=0&&y<L.h&&x>=0&&x<L.w)drawTile(L.tctx,L,LEVELS[lvl].pal,x,y);
 shake=8;SFX.brk();computeEdge();persist();
 banner({kind:'hint',title:'A hidden passage',sub:'The wall crumbled',dur:120});
}
function combat(){
 // the melee swing and every flying arrow go through the same hit rules, each with its own hit id
 const on=P.atkT>=4&&P.atkT<=11&&save.weapon!=='bow';
 curSwing=P.swing;combatPass(on?atkBox():null,WEAPONS[save.weapon].dmg+strBonus(),true);
 for(const a of arrows){if(a.dead)continue;curSwing=a.id;if(combatPass({x:a.x-4,y:a.y-2,w:8,h:4},a.dmg,false)){a.dead=true;burst(a.x,a.y,6,['#d8cfbf','#ffffff'],1.2,0.1,14);}}
}
function combatPass(box,dmg,body){
 if(box&&!L.gateOn){
  const x0=Math.floor(box.x/16),x1=Math.floor((box.x+box.w)/16),y0=Math.floor(box.y/16),y1=Math.floor((box.y+box.h)/16);

   const c=tileAt(tx,ty);
   if(c==='X'){breakTile(tx,ty);break outer;}
   if(c==='Y'){
    if(dmg>=4){breakTile(tx,ty);break outer;}
    if(P.clang!==curSwing){P.clang=curSwing;SFX.clang();burst(tx*16+(P.face>0?1:15),P.y+8,6,['#ffffff','#ffcf6a'],1.4,0.05,14);if(!clangHint){clangHint=true;banner({kind:'hint',title:'Iron-bound wall',sub:'You need a heavier weapon to smash it',dur:200});}}
   }
  }
 }
 let hitAny=false;
 for(const e of ents){

   burst(e.x+e.w/2,e.y+e.h/2,5,['#ffffff','#ebe4d0'],1.6,0.05,12);

  }
  if(body&&!e.gone&&overlap(P,e)){const hr=hurtPlayer(e.dmg,e.x+e.w/2);if(hr&&e.type==='bat'){e.vx*=-2;e.vy=-1.5;}if(hr===true&&e.type==='mhead'){P.petrify=40;SFX.stone();}}
 }
 for(const c of candles){
  if(!c.broken&&box&&overlap(box,c)){c.broken=true;SFX.tick();burst(c.x+3,c.y+2,8,['#ffcf6a','#ff8a3a','#ffffff'],1.5,0.1,25);if(Math.random()<DIFF().drop)drops.push({x:c.x,y:c.y,w:7,h:6,vx:0,vy:-2.5,t:0});}
 }
 if(box)for(const pr of projs){if(pr.kind!=='wave'&&overlap(box,{x:pr.x-pr.r,y:pr.y-pr.r,w:pr.r*2,h:pr.r*2})){pr.dead=true;burst(pr.x,pr.y,6,['#ffffff','#ffcf6a'],1.4,0.05,14);}}
 if(boss&&boss.active&&!boss.dying&&boss.wait<=0){
  const b=boss;

   const HY=HYDRAS[b.v],shed=b.state==='shed';
   for(const h of b.heads){
    if(h.dead||h.grow<1)continue;
    const hb=hydraHeadBox(h);
    if(!shed&&box&&overlap(box,hb)&&h.lastSwing!==curSwing){
     h.lastSwing=curSwing;h.hp-=dmg;h.hurt=10;hitAny=true;burst(h.x,h.y,8,HY.hit,1.8,0.1,22);
     if(h.hp<=0){
      h.dead=true;h.regrow=DIFF().boss<1?900:720;shake=10;SFX.roar();burst(h.x,h.y,22,HY.shed,2.4,0.12,40,2);
      if(b.v==='F'&&b.phase===1)for(let i=0;i<8;i++)parts.push({x:h.x+rnd(-6,6),y:h.y+rnd(-4,4),vx:rnd(-1,1),vy:rnd(-2,0),grav:0.1,life:40,max:40,c:'#ff6a2a',s:1});
      if(!b.hintShown&&b.phase===1){b.hintShown=true;banner({kind:'hint',title:'The head grows back',sub:'Cut off all three before they heal',dur:200});}
      if(b.phase===2&&b.heads.every(q=>q.dead))startBossDeath();
     }
    }
    if(!boss.dying&&!shed&&overlap(P,hb))hurtPlayer(1,h.x);
   }
   b.hp=hydraHp(b);
   if(!b.dying&&P.x+P.w>b.bx-4){P.x=b.bx-4-P.w;hurtPlayer(1,b.bx+30);}
  }else if(b.type==='dragon'){
   const head={x:b.hx-12,y:b.hy-8,w:24,h:16},body={x:b.bx-26,y:b.by-18,w:52,h:34};
   if(box&&b.lastSwing!==curSwing&&b.state!=='rage'){
    if(overlap(box,head)||(b.phase>=2&&overlap(box,body))){
     b.lastSwing=curSwing;b.hp=Math.max(0,b.hp-dmg);b.hurt=10;hitAny=true;burst(head.x+12,head.y+8,8,[DRAGONS[b.v].bone,DRAGONS[b.v].eye],1.8,0.1,22);
     if(b.hp<=0)startBossDeath();
    }else if(b.phase===1&&overlap(box,body)){b.lastSwing=curSwing;SFX.clang();burst(body.x+4,P.y+8,5,['#ffffff'],1.2,0.05,12);}
   }

   const bb=bossBox(b);

   }else if(vulnerable&&box&&overlap(box,bb)&&b.lastSwing!==curSwing){

    if(b.hp<=0)startBossDeath();
   }
   if(vulnerable&&!b.dying&&overlap(P,bb))hurtPlayer(1,bb.x+bb.w/2);
  }
 }
 if(hitAny)SFX.hit();
 return hitAny;
}

  if((p.kind==='fire'||p.kind==='bonefire')&&p.t%2===0)parts.push({x:p.x,y:p.y,vx:rnd(-0.2,0.2),vy:rnd(-0.3,0),grav:0,life:14,max:14,c:p.kind==='fire'?'#ff8a3a':'#9ad8ff',s:1});

   if(stored){if(hit.enter)continueGame();else if(hit.new){diffSel=1;mode='diff';}else if(hit.select&&anyDone(stored)){save=stored;openSelect('title');}}
   else if(hit.enter||hit.new){diffSel=1;mode='diff';}
   break;
  case 'diff':
   if(hit.left){diffSel=(diffSel+2)%3;SFX.tick();}
   if(hit.right){diffSel=(diffSel+1)%3;SFX.tick();}
   if(hit.enter)startNew(DIFF_ORDER[diffSel]);
   if(hit.pause)mode='title';
   break;
  case 'select':
   if(hit.left&&sel>0){sel--;SFX.tick();}
   if(hit.right&&sel<4){sel++;SFX.tick();}
   if(hit.enter||hit.use)enterFromSelect(sel);
   if(hit.pause||hit.select){if(selectFrom==='pause')mode='pause';else if(selectFrom==='door')mode='play';else mode='title';}
   break;
  case 'play':playStep();break;
  case 'pause':
   switchWeapons();
   if(hit.map)mode='map';
   else if(hit.select&&anyDone(save)&&!(boss&&boss.active))openSelect('pause');
   else if(hit.pause||hit.enter)mode='play';
   break;
  case 'map':if(hit.map||hit.pause||hit.enter)mode='play';break;
  case 'transform':transformStep();break;
  case 'dead':deadT++;updParts();if(deadT>50&&(hit.enter||hit.jump||hit.attack)){mode='trans';fadeTo(()=>{resetActors();mode='play';});}break;
  case 'ending':endT++;if(endT>90&&hit.enter){openSelect('title',endKind===1?3:4);}break;
  case 'trans':break;
 }
 for(const k in hit)hit[k]=false;
}

 const tx=hx+ca*(w.len-1),ty=hy+sa*(w.len-1);

const GHOST_PX=(()=>{
 const px=[],put=(x,y,w,h,c)=>{for(let j=0;j<h;j++)for(let i=0;i<w;i++){const q=px.find(p=>p.lx===x+i&&p.ly===y+j);if(q)q.c=c;else px.push({lx:x+i,ly:y+j,c});}};
 put(2,0,8,9,'#d8e6ee');put(1,2,10,6,'#d8e6ee');put(2,0,8,1,'#f2f8fb');
 for(let k=0;k<5;k++)put(1+k*2,9,2,4,'#b8ccd8');
 put(6,3,2,3,'#1a1a2a');put(9,3,1,3,'#1a1a2a');put(7,7,2,2,'#1a1a2a');
 return px;
})();
const GHOST_HI={r:154,g:216,b:255},GHOST_EYE='#1a1a2a';

}

}
function ghostScatter(e){

  const dx=bx-pcx,dy=by-pcy,d=Math.hypot(dx,dy);if(d>0&&d<18){const f=Math.pow(1-d/18,2)*6;bx+=dx/d*f;by+=dy/d*f;}

  text('The bones carried you all the way. Now you walk on as a human.',860,372,`22px ${FU}`,'#ffe7a0','center');
 }
 if(endStats)text(`Time ${fmtTime(endStats.frames)}   ·   Deaths ${endStats.deaths}   ·   Treasures ${endStats.found}/${TOTAL_ITEMS}   ·   Hearts ${endStats.hearts}/${TOTAL_HEARTS}`,860,440,`22px ${FU}`,'#ffe7a0','center');
 if(endT>90)text('Press Enter to open the castle map',860,540,`28px ${FU}`,Math.floor(frameN/32)%2?'#ffffff':'#ffe7a0','center');
}
function wantSong(){
 if(['title','diff','select'].includes(mode))return 'title';
 if(mode==='ending')return 'ending';
 if(!L)return 'title';
 if(boss&&boss.active&&!boss.dying)return 'boss'+lvl;
 return 'night'+lvl;
}
function render(){
 ctx.imageSmoothingEnabled=false;
 if(Snd.ctx)setSong(wantSong());
 if(mode==='title')renderTitle();
 else if(mode==='diff')renderDiff();
 else if(mode==='select')renderSelect();
 else if(mode==='ending')renderEnding();
 else{
  renderWorld();
  ctx.drawImage(buf,0,0,W*SC,H*SC);
  renderHUD();
  if(mode!=='map')drawMinimap();
  if(mode==='pause')renderPause();
  if(mode==='map')renderMap();
  if(mode==='dead')renderDead();
 }
 if(mode!=='map'&&mode!=='pause')drawBanner();
 if(toastT>0){ctx.globalAlpha=Math.min(1,toastT/20);ctx.fillStyle='rgba(12,6,14,0.85)';ctx.fillRect(1080,520,180,48);text(toast,1170,552,`22px ${FU}`,'#f3d38a','center');ctx.globalAlpha=1;}
 if(fade.a>0){ctx.fillStyle=`rgba(0,0,0,${fade.a})`;ctx.fillRect(0,0,cv.width,cv.height);}
}

let acc=0,last=performance.now();
function frame(now){
 acc+=Math.min(100,now-last);last=now;
 let n=0;while(acc>=1000/60&&n<5){step();acc-=1000/60;n++;}
 if(n===5)acc=0;
 render();
 requestAnimationFrame(frame);
}
try{cv.focus({preventScroll:true});}catch(e){}
requestAnimationFrame(frame);
})();
</script>
