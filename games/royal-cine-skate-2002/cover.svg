<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="640" height="360">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3f9be8"/>
      <stop offset="1" stop-color="#bfe6ff"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7ed957"/>
      <stop offset="1" stop-color="#3fae3a"/>
    </linearGradient>
    <linearGradient id="ramp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff4d8d"/>
      <stop offset="1" stop-color="#ff86b1"/>
    </linearGradient>
  </defs>
  <rect width="640" height="360" fill="url(#sky)"/>
  <!-- clouds -->
  <g fill="#fff" opacity="0.95">
    <circle cx="90" cy="70" r="24"/><circle cx="120" cy="58" r="30"/><circle cx="155" cy="72" r="22"/><rect x="88" y="70" width="70" height="24" rx="12"/>
    <circle cx="470" cy="50" r="18"/><circle cx="495" cy="40" r="24"/><circle cx="522" cy="52" r="17"/><rect x="468" y="50" width="56" height="18" rx="9"/>
  </g>
  <!-- Kongens Have on the right -->
  <path d="M300 262 Q470 236 640 240 L640 306 L300 306 Z" fill="url(#grass)"/>
  <g>
    <rect x="410" y="214" width="9" height="34" rx="3" fill="#7a4f2e"/>
    <circle cx="414" cy="200" r="26" fill="#5cc23d"/><circle cx="398" cy="212" r="18" fill="#4aa832"/><circle cx="432" cy="212" r="18" fill="#6fd24c"/>
    <rect x="560" y="205" width="10" height="40" rx="3" fill="#7a4f2e"/>
    <circle cx="565" cy="188" r="30" fill="#5cc23d"/><circle cx="545" cy="202" r="20" fill="#4aa832"/><circle cx="588" cy="200" r="21" fill="#6fd24c"/>
    <path d="M610 245 L622 190 L634 245 Z" fill="#2f9e5a"/>
  </g>
  <!-- the giant rat waiting on the lawn -->
  <g transform="translate(500 272) scale(0.85)">
    <path d="M-34 6 C-70 16 -82 -6 -96 4" stroke="#ff9fb4" stroke-width="6" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="40" ry="24" fill="#8a7d74"/>
    <ellipse cx="2" cy="8" rx="28" ry="12" fill="#c9bdb2"/>
    <circle cx="38" cy="-10" r="18" fill="#8a7d74"/>
    <path d="M50 -8 L70 -2 L52 4 Z" fill="#8a7d74"/>
    <circle cx="70" cy="-2" r="4" fill="#ff7a96"/>
    <circle cx="32" cy="-28" r="10" fill="#8a7d74"/><circle cx="32" cy="-28" r="6" fill="#ffb3c4"/>
    <circle cx="46" cy="-14" r="5" fill="#fff"/><circle cx="47" cy="-14" r="3" fill="#1b1b1f"/>
    <rect x="-26" y="18" width="10" height="12" rx="5" fill="#8a7d74"/><rect x="16" y="18" width="10" height="12" rx="5" fill="#8a7d74"/>
  </g>
  <!-- Gothersgade (street) -->
  <path d="M200 304 L640 296 L640 334 L200 346 Z" fill="#5d6168"/>
  <path d="M250 324 L300 323 M360 321 L410 320 M470 318 L520 317 M580 316 L630 315" stroke="#fff" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
  <path d="M200 346 L640 334 L640 360 L200 360 Z" fill="#c9c3b8"/>
  <path d="M200 300 L640 292 L640 297 L200 305 Z" fill="#c9c3b8"/>
  <!-- Cinemateket building with the rooftop ramp -->
  <path d="M0 250 L220 222 L220 360 L0 360 Z" fill="#e8c98e"/>
  <g fill="#2c3e55">
    <rect x="18" y="268" width="16" height="22" rx="2"/><rect x="58" y="264" width="16" height="22" rx="2"/><rect x="98" y="259" width="16" height="22" rx="2"/><rect x="138" y="254" width="16" height="22" rx="2"/><rect x="178" y="249" width="16" height="22" rx="2"/>
    <rect x="18" y="310" width="16" height="22" rx="2"/><rect x="58" y="306" width="16" height="22" rx="2"/><rect x="98" y="301" width="16" height="22" rx="2"/><rect x="138" y="296" width="16" height="22" rx="2"/><rect x="178" y="291" width="16" height="22" rx="2"/>
  </g>
  <path d="M0 250 L220 222 L220 230 L0 258 Z" fill="#ffd23f"/>
  <path d="M120 236 Q190 232 222 196 L222 222 L120 236 Z" fill="url(#ramp)"/>
  <path d="M120 236 Q190 232 222 196" stroke="#fff" stroke-width="3" fill="none"/>
  <!-- the skater flying over the street -->
  <g transform="translate(330 150) rotate(-12)">
    <path d="M-120 40 Q-70 10 -30 4" stroke="#fff" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.7"/>
    <path d="M-110 58 Q-64 28 -26 22" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.5"/>
    <!-- board -->
    <rect x="-38" y="34" width="76" height="10" rx="5" fill="#ffca28" stroke="#1b1b1f" stroke-width="3"/>
    <circle cx="-22" cy="48" r="5" fill="#f6efe0" stroke="#1b1b1f" stroke-width="2"/><circle cx="22" cy="48" r="5" fill="#f6efe0" stroke="#1b1b1f" stroke-width="2"/>
    <!-- legs tucked -->
    <path d="M-10 0 L-24 18 L-16 32" stroke="#2f3b4c" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M10 0 L22 16 L16 32" stroke="#2f3b4c" stroke-width="13" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- body -->
    <rect x="-20" y="-40" width="40" height="44" rx="18" fill="#ff7043" stroke="#1b1b1f" stroke-width="3"/>
    <!-- arm grabbing the board, other arm up -->
    <path d="M16 -28 Q34 -2 26 34" stroke="#ff7043" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M-16 -30 Q-40 -50 -46 -70" stroke="#ff7043" stroke-width="11" fill="none" stroke-linecap="round"/>
    <circle cx="-46" cy="-72" r="7" fill="#f1c7a5"/>
    <!-- big cartoon head with beanie -->
    <circle cx="0" cy="-62" r="24" fill="#f1c7a5" stroke="#1b1b1f" stroke-width="3"/>
    <path d="M-24 -66 Q0 -104 24 -66 Z" fill="#1e88e5" stroke="#1b1b1f" stroke-width="3"/>
    <circle cx="0" cy="-96" r="6" fill="#1e88e5" stroke="#1b1b1f" stroke-width="2"/>
    <ellipse cx="-8" cy="-60" rx="4" ry="6" fill="#fff"/><ellipse cx="9" cy="-60" rx="4" ry="6" fill="#fff"/>
    <circle cx="-7" cy="-59" r="2.5" fill="#1b1b1f"/><circle cx="10" cy="-59" r="2.5" fill="#1b1b1f"/>
    <path d="M-8 -48 Q1 -40 10 -48" stroke="#8a3b3b" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- title -->
  <g font-family="Impact, 'Arial Black', sans-serif" font-weight="900" font-style="italic" text-anchor="middle">
    <text x="322" y="78" font-size="50" fill="#1b1b1f" transform="rotate(-4 320 70)">ROYAL CINE SKATE</text>
    <text x="318" y="74" font-size="50" fill="#ffd23f" stroke="#1b1b1f" stroke-width="3" paint-order="stroke" transform="rotate(-4 320 70)">ROYAL CINE SKATE</text>
    <text x="508" y="118" font-size="30" fill="#ff4d6d" stroke="#1b1b1f" stroke-width="3" paint-order="stroke" transform="rotate(-4 500 110)">2002</text>
  </g>
</svg>
