    <style>:root{--ink:#1b1b1f;--paper:#fffaf0;--sun:#ffd54f;--hot:#ff5a36;--sky:#4fc3f7;--grass:#7cc35a;--violet:#8e63ff;--shadow:4px 4px 0 var(--ink);color:var(--ink);font-family:Trebuchet MS,Segoe UI,system-ui,-apple-system,sans-serif}*{box-sizing:border-box}html,body,#app{background:#f6dcc0;width:100%;height:100%;margin:0;overflow:hidden}.game-canvas{width:100vw;height:100vh;display:block;position:fixed;inset:0}button{font:inherit;cursor:pointer}.overlay{z-index:10;position:fixed;inset:0}.overlay.center{text-align:center;flex-direction:column;justify-content:center;align-items:center;gap:12px;display:flex}.overlay.dim{background:#14101e73}.loading{background:linear-gradient(#5aa7e6 0%,#f6dcc0 100%)}.spinner{border:6px solid var(--ink);border-top-color:var(--sun);border-radius:50%;width:48px;height:48px;animation:.9s linear infinite spin}@keyframes spin{to{transform:rotate(360deg)}}.logo{letter-spacing:.02em;color:var(--sun);-webkit-text-stroke:3px var(--ink);text-shadow:5px 5px 0 var(--ink);margin:0;font-size:clamp(44px,7vw,88px);font-style:italic;font-weight:900;transform:rotate(-3deg)}.subtitle{background:var(--ink);color:var(--paper);margin:4px 0 18px;padding:4px 10px;font-weight:700;display:inline-block;transform:rotate(-1deg)}.attribution{opacity:.8;font-size:12px}.panel{background:var(--paper);border:3px solid var(--ink);box-shadow:var(--shadow);border-radius:14px;padding:18px 20px}.menu{pointer-events:none;justify-content:space-between;align-items:flex-start;gap:24px;padding:28px 32px;display:flex}.menu>*{pointer-events:auto}.menu-left{flex-direction:column;gap:12px;width:min(420px,44vw);display:flex}.menu-right{width:min(520px,46vw);max-height:calc(100vh - 56px);overflow:auto}.field{flex-direction:column;gap:4px;display:flex}.field span,.field-label{text-transform:uppercase;letter-spacing:.06em;text-shadow:0 1px #fff;font-size:13px;font-weight:800}.field input{font:inherit;border:3px solid var(--ink);box-shadow:var(--shadow);background:#fff;border-radius:10px;padding:10px 12px;font-size:20px;font-weight:700}.avatar-row{align-items:stretch;gap:8px;display:flex}.avatar-card{background:var(--paper);border:3px solid var(--ink);box-shadow:var(--shadow);border-radius:12px;flex-direction:column;flex:1;gap:2px;padding:10px 12px;display:flex}.avatar-card strong{font-size:20px}.avatar-card small{opacity:.75}.swatches{gap:4px;display:flex}.swatches span{border:2px solid var(--ink);border-radius:50%;width:18px;height:18px}.arrow{border:3px solid var(--ink);background:var(--sun);width:46px;box-shadow:var(--shadow);border-radius:12px;font-size:34px;font-weight:900}.arrow:active,.big-button:active,.small-button:active{box-shadow:2px 2px 0 var(--ink);transform:translate(2px,2px)}.dots{gap:8px;margin-top:8px;display:flex}.dot{border:3px solid var(--ink);border-radius:50%;width:26px;height:26px}.dot.active{outline:3px solid var(--sun);outline-offset:2px}.big-button{border:3px solid var(--ink);background:var(--hot);color:#fff;box-shadow:var(--shadow);letter-spacing:.04em;text-shadow:2px 2px 0 var(--ink);border-radius:14px;padding:12px 28px;font-size:28px;font-weight:900}.big-button:hover{filter:brightness(1.08)}.small-button{border:3px solid var(--ink);box-shadow:var(--shadow);background:#fff;border-radius:12px;padding:10px 16px;font-weight:800}.goal{border:2px solid var(--ink);background:#fffaf0e6;border-radius:10px;margin:0;padding:8px 10px;font-size:14px}.tabs{flex-wrap:wrap;gap:6px;margin-bottom:12px;display:flex}.tabs button{border:2px solid var(--ink);background:#fff;border-radius:999px;padding:6px 12px;font-weight:800}.tabs button.active{background:var(--ink);color:var(--paper)}.scores{border-collapse:collapse;width:100%}.scores th{text-align:left;text-transform:uppercase;letter-spacing:.05em;border-bottom:2px solid var(--ink);padding:4px;font-size:12px}.scores td{border-bottom:1px dashed #0003;padding:6px 4px}.scores td.num{text-align:right;font-variant-numeric:tabular-nums;font-weight:900}.scores td.trick{opacity:.75;max-width:180px;font-size:12px}.scores tr.highlight td{background:var(--sun)}.scores.empty{text-align:center;padding:20px}.mini-avatar{vertical-align:-2px;border:3px solid;border-radius:50%;width:14px;height:14px;margin-right:6px;display:inline-block}.badge{margin-left:4px}.controls table{border-collapse:collapse;width:100%}.controls td{vertical-align:top;padding:5px 4px}kbd{text-align:center;border:2px solid var(--ink);white-space:nowrap;background:#fff;border-bottom-width:4px;border-radius:7px;min-width:34px;padding:3px 7px;font-family:inherit;font-weight:900;display:inline-block}.tip{opacity:.8;font-size:13px}.settings{flex-direction:column;gap:14px;display:flex}.setting{justify-content:space-between;align-items:center;gap:12px;font-weight:700;display:flex}.setting.check{justify-content:flex-start}.seg{border:2px solid var(--ink);border-radius:10px;display:flex;overflow:hidden}.seg button{background:#fff;border:0;padding:6px 12px;font-weight:800}.seg button.active{background:var(--ink);color:#fff}.about p{line-height:1.45}.hud{pointer-events:none;z-index:5;font-weight:900;position:fixed;inset:0}.hud-top-left{position:absolute;top:16px;left:20px}.score{color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink);font-variant-numeric:tabular-nums;font-size:44px}.player{background:var(--ink);color:var(--paper);border-radius:6px;padding:2px 8px;font-size:15px;display:inline-block}.hud-timer{background:var(--paper);border:3px solid var(--ink);box-shadow:var(--shadow);font-variant-numeric:tabular-nums;border-radius:12px;padding:2px 12px;font-size:34px;position:absolute;top:16px;right:20px}.hud-timer.warn{background:var(--hot);color:#fff;animation:.8s infinite pulse}@keyframes pulse{50%{transform:scale(1.06)}}.hud-location{color:var(--paper);background:#1b1b1fcc;border-radius:999px;padding:4px 14px;font-size:15px;position:absolute;top:18px;left:50%;transform:translate(-50%)}.big-message{text-align:center;width:90vw;animation:.45s cubic-bezier(.2,1.6,.4,1) pop;position:absolute;top:24%;left:50%;transform:translate(-50%)}.big-text{color:var(--sun);-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--ink);font-size:clamp(40px,8vw,96px);font-style:italic;transform:rotate(-3deg)}.big-sub{background:var(--paper);border:3px solid var(--ink);box-shadow:var(--shadow);border-radius:10px;margin-top:10px;padding:6px 14px;font-size:20px;display:inline-block}@keyframes pop{0%{opacity:0;transform:translate(-50%)scale(.3)}to{opacity:1;transform:translate(-50%)scale(1)}}.messages{flex-direction:column;align-items:flex-start;gap:6px;display:flex;position:absolute;top:90px;left:20px}.msg{background:var(--paper);border:3px solid var(--ink);box-shadow:var(--shadow);border-radius:10px;flex-direction:column;max-width:46vw;padding:4px 10px;animation:.25s ease-out slide;display:flex}.msg small{opacity:.8;font-weight:700}.msg.good{background:#d9f7c5}.msg.bad{background:#ffd0c2}@keyframes slide{0%{opacity:0;transform:translate(-30px)}}.combo{text-align:center;position:absolute;bottom:96px;left:50%;transform:translate(-50%)}.combo-label{color:#fff;-webkit-text-stroke:1px var(--ink);text-shadow:2px 2px 0 var(--ink);font-size:18px}.combo-points{color:var(--sun);-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink);font-size:34px}.combo-points span{color:var(--hot)}.combo-bar{border:2px solid var(--ink);background:#fff;border-radius:6px;width:220px;height:8px;margin:4px auto 0;overflow:hidden}.combo-bar div{background:var(--hot);height:100%}.hint{background:var(--sun);border:3px solid var(--ink);box-shadow:var(--shadow);white-space:nowrap;border-radius:10px;padding:6px 14px;font-size:16px;position:absolute;bottom:28px;left:50%;transform:translate(-50%)}.hud-speed{text-align:right;position:absolute;bottom:20px;right:22px}.kmh{color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:3px 3px 0 var(--ink);font-variant-numeric:tabular-nums;font-size:54px}.unit{margin-left:6px;font-size:18px}.tuck{border:2px solid var(--ink);background:#fff;border-radius:8px;margin-top:4px;padding:2px 8px;font-size:13px}.tuck.on{background:var(--grass)}.portal-arrow{text-align:center;color:var(--violet);position:absolute;top:70px;left:50%;transform:translate(-50%)}.arrow-icon{-webkit-text-stroke:2px var(--ink);font-size:48px;transition:transform .1s linear}.portal-arrow small{background:var(--paper);border:2px solid var(--ink);color:var(--ink);border-radius:8px;padding:1px 6px;display:block}.fps{color:#9cff57;background:#0009;border-radius:4px;padding:3px 6px;font-family:ui-monospace,monospace;font-size:12px;position:absolute;bottom:16px;left:20px}.pause,.gameover{width:min(560px,92vw);max-height:92vh;overflow:auto}.pause h2,.gameover h2{margin:0;font-size:42px;font-style:italic}.button-row{flex-wrap:wrap;justify-content:center;gap:10px;margin:14px 0;display:flex}.reason{margin:4px 0 8px;font-weight:700}.final-score{color:var(--sun);-webkit-text-stroke:3px var(--ink);text-shadow:4px 4px 0 var(--ink);font-size:64px;font-weight:900;line-height:1}.final-label{margin:0 0 8px;font-weight:800}.rank{background:var(--sun);border:2px solid var(--ink);border-radius:8px;padding:4px 10px;font-weight:800;display:inline-block}.best{margin:6px 0}@media (width<=760px){.menu{flex-direction:column;padding:16px;overflow:auto}.menu-left,.menu-right{width:100%}}.trick-pops{pointer-events:none;flex-direction:column;align-items:center;display:flex;position:absolute;top:38%;left:50%;transform:translate(-50%)}.trick-pop{color:#fff;-webkit-text-stroke:2px var(--ink);text-shadow:4px 4px 0 var(--hot);white-space:nowrap;font-size:clamp(28px,4.5vw,54px);font-style:italic;animation:1.1s ease-out forwards trickpop}@keyframes trickpop{0%{opacity:0;transform:scale(.4)rotate(-8deg)}15%{opacity:1;transform:scale(1.15)rotate(-3deg)}70%{opacity:1;transform:scale(1)rotate(-3deg)}to{opacity:0;transform:translateY(-30px)scale(.9)rotate(-3deg)}}.dog-warn{background:var(--paper);color:var(--ink);border:2px solid var(--ink);border-radius:8px;margin-top:6px;padding:2px 8px;font-size:14px}.dog-warn.close{background:var(--hot);color:#fff;animation:.5s infinite pulse}

  <body>
    <div id="app"></div>
    <noscript>Spillet kræver JavaScript.</noscript>
    <!-- The game is split into 7 parts (the hall allows max 200 kB per file). -->
    <script src="del-1.js"></script>
    <script src="del-2.js"></script>
    <script src="del-3.js"></script>
    <script src="del-4.js"></script>
    <script src="del-5.js"></script>
    <script src="del-6.js"></script>
    <script src="del-7.js"></script>
    <script>
      // join the parts and start the game as a module
      var game = document.createElement('script');
      game.type = 'module';
      game.src = URL.createObjectURL(new Blob([window.__tagskate_parts.join('')], { type: 'text/javascript' }));
      document.body.appendChild(game);
    </script>
